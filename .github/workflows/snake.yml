name: Generar snake de contribuciones

on:
  schedule:
    - cron: "0 6 * * *"   # diario, 6:00 UTC
  workflow_dispatch:       # permite correrlo manualmente desde la pestaña Actions
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  snake:
    runs-on: ubuntu-latest
    steps:
      - uses: Platane/snk@v3
        with:
          github_user_name: JCarlos-GM
          outputs: |
            dist/github-contribution-grid-snake.svg
            dist/github-contribution-grid-snake-dark.svg?palette=github-dark
            dist/github-contribution-grid-snake-red.svg?palette=github-dark&color_snake=#e3262e&color_dots=#161616,#3b0d0f,#6e1418,#a61c22,#e3262e

      - uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
